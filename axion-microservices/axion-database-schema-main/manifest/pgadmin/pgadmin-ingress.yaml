apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin-ingress
  namespace: axion
  labels:
    app.kubernetes.io/name: pgadmin-ingress
spec:
  ingressClassName: azure-application-gateway
  rules:
  - host: pgadmin.anuragdevops.shop
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: pgadmin-service
            port:
              number: 80
